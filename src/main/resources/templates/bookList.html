
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Book List</title>
</head>

<body>

<!-- Logged-in user information -->
<div style="float: right;">

    Logged in as:
    <span sec:authentication="name">User</span>

    <!-- Logout Button -->
    <form th:action="@{/logout}"
          method="post"
          style="display: inline;">

        <button type="submit">Sign Out</button>

    </form>

</div>

<h1>Book List</h1>

<p>
    <a th:href="@{/cart}">View Shopping Cart</a>
</p>

<!-- ADMIN ONLY: Add Book -->
<div sec:authorize="hasRole('ADMIN')">
    <p>
        <a th:href="@{/books/add}">Add New Book</a>
    </p>
</div>

<table border="1">

    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>ISBN</th>
        <th>Price</th>
        <th>Copies</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="book : ${books}">

        <td th:text="${book.id}"></td>

        <td th:text="${book.title}"></td>

        <td th:text="${book.author}"></td>

        <td th:text="${book.isbn}"></td>

        <td th:text="${book.price}"></td>

        <td th:text="${book.copies}"></td>

        <td>

            <!-- All logged-in users can add to cart -->
            <form th:action="@{/cart/add/{id}(id=${book.id})}"
                  method="post">

                <button type="submit">Add to Cart</button>

            </form>

            <!-- ADMIN ONLY: Edit and Delete -->
            <div sec:authorize="hasRole('ADMIN')">

                <a th:href="@{/books/edit/{id}(id=${book.id})}">
                    Edit
                </a>

                |

                <a th:href="@{/books/delete/{id}(id=${book.id})}">
                    Delete
                </a>

            </div>

        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
